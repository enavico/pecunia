<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PECUNIA!</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="pecunia-header">

        <!-- Banconote decorative a sinistra -->
        <div
            class="banknote banknote-euro"
            aria-hidden="true"
        >
            <span>€</span>
            <strong>50</strong>
            <small>PECUNIA</small>
        </div>

        <div
            class="banknote banknote-dollar"
            aria-hidden="true"
        >
            <span>$</span>
            <strong>100</strong>
            <small>PECUNIA</small>
        </div>

        <!-- Banconote decorative a destra -->
        <div
            class="banknote banknote-franc"
            aria-hidden="true"
        >
            <span>₣</span>
            <strong>60</strong>
            <small>PECUNIA</small>
        </div>

        <div
            class="banknote banknote-pound"
            aria-hidden="true"
        >
            <span>£</span>
            <strong>40</strong>
            <small>PECUNIA</small>
        </div>

        <!-- Zona centrale libera e leggibile -->
        <div class="header-content">
            <h1>PECUNIA!</h1>

            <div id="game-info"></div>
        </div>

    </header>

    <!-- ======================================
         MENU INIZIALE
         ====================================== -->

    <section
        id="setup-menu"
        class="setup-menu"
    >
        <h2>Nuova partita</h2>

        <p>
            Scegli il numero totale di giocatori,
            te compreso.
        </p>

        <div class="setup-buttons">
            <button
                type="button"
                data-player-count="3"
            >
                3 giocatori
            </button>

            <button
                type="button"
                data-player-count="4"
            >
                4 giocatori
            </button>

            <button
                type="button"
                data-player-count="5"
            >
                5 giocatori
            </button>
        </div>
    </section>

    <!-- ======================================
         TAVOLO
         ====================================== -->

    <main
        id="table"
        hidden
    >

        <!-- I bot vengono creati da game.js -->
        <section
            id="players"
            class="players"
        ></section>

        <!-- Offerte A, B e mazzo dinamico -->
        <section class="center">

            <div class="market">

                <div class="market-title">
                    Offerta A
                </div>

                <div
                    id="market-left"
                    class="cards"
                ></div>

            </div>

            <div class="market">

                <div class="market-title">
                    Offerta B
                </div>

                <div
                    id="market-right"
                    class="cards"
                ></div>

            </div>

            <!-- #deck-area viene creato da renderDeck() -->

        </section>

        <!-- Messaggio, puntata e Nessuno scambio -->
        <section
            id="message"
            class="message"
        >

            <div id="message-text">
                Scegli le carte da utilizzare per la tua offerta.
            </div>

            <div id="player-bid"></div>

        </section>

        <!-- Mano umana -->
        <section id="hand">

            <h2>La tua mano</h2>

            <div
                id="player-hand"
                class="cards"
            ></div>

        </section>

        <!-- Conferma offerta, classifica e nuova partita -->
        <section
            id="actions"
            class="actions"
        ></section>

        <!-- Il log viene creato dinamicamente da renderLogs() -->

    </main>

    <script src="game.js"></script>

</body>
</html>
