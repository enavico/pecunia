<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Soldi</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>Soldi</h1>
</header>

<main id="table">

    <section class="players">

        <div class="player">
            <div class="player-name">Bot 1</div>

            <div class="cards">
                <div class="card">?</div>
                <div class="card">?</div>
                <div class="card">?</div>
            </div>
        </div>

        <div class="player">
            <div class="player-name">Bot 2</div>

            <div class="cards">
                <div class="card">?</div>
                <div class="card">?</div>
                <div class="card">?</div>
            </div>
        </div>

        <div class="player">
            <div class="player-name">Bot 3</div>

            <div class="cards">
                <div class="card">?</div>
                <div class="card">?</div>
                <div class="card">?</div>
            </div>
        </div>

    </section>


    <section class="center">

        <div class="market">

            <div class="market-title">
                Offerta A
            </div>

            <div class="cards">
                <div class="card">20</div>
                <div class="card">30</div>
                <div class="card">50</div>
                <div class="card">60</div>
            </div>

        </div>


        <div class="market">

            <div class="market-title">
                Offerta B
            </div>

            <div class="cards">
                <div class="card">10</div>
                <div class="card">40</div>
                <div class="card">70</div>
                <div class="card">80</div>
            </div>

        </div>

    </section>


    <div class="message">
        Scegli le carte da utilizzare per la tua offerta.
    </div>


    <section id="hand">

        <h2>La tua mano</h2>

        <div class="cards">

            <div class="card">10</div>
            <div class="card">20</div>
            <div class="card">30</div>
            <div class="card">40</div>
            <div class="card">50</div>
            <div class="card">60</div>

        </div>

    </section>


    <section class="actions">

        <button id="confirm-bid">
            Conferma offerta
        </button>

        <button id="pass">
            Passa
        </button>

    </section>

</main>


<script src="game.js"></script>

</body>

</html>
