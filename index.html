<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pecunia</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>Pecunia</h1>
    <div id="game-info"></div>
</header>

<section id="setup-menu" class="setup-menu">
    <h2>Nuova partita</h2>
    <p>Scegli il numero totale di giocatori, te compreso.</p>

    <div class="setup-buttons">
        <button type="button" data-player-count="3">3 giocatori</button>
        <button type="button" data-player-count="4">4 giocatori</button>
        <button type="button" data-player-count="5">5 giocatori</button>
    </div>
</section>

<main id="table" hidden>
    
    <section class="players" id="players">
    </section>


    <section class="center">

        <div class="market">

            <div class="market-title">
                Offerta A
            </div>

            <div class="cards" id="market-left">
            </div>

        </div>


        <div class="market">

            <div class="market-title">
                Offerta B
            </div>

            <div class="cards" id="market-right">
            </div>

        </div>

    </section>


    <div class="message" id="message">

        <div id="message-text">
            Scegli le carte da utilizzare per la tua offerta.
        </div>

        <div id="player-bid">
        </div>

    </div>


    <section id="hand">

        <h2>La tua mano</h2>

        <div class="cards" id="player-hand">
        </div>

    </section>


    <section class="actions" id="actions">
    </section>

</main>


<script src="game.js"></script>

</body>

</html>
